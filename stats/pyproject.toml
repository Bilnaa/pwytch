[project]
name = "stats"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "common",
    "fastapi[standard]>=0.128.8",
    "psycopg[binary]>=3.3.6",
    "pydantic-settings>=2.15.0",
    "redis>=8.1.0",
    "sqlalchemy[asyncio]>=2.0.54",
]

[dependency-groups]
dev = [
    "aiosqlite>=0.22.1",
    "fakeredis>=2.39.0",
    "httpx>=0.28.1",
    "pytest>=8.4.2",
]

[tool.uv.sources]
common = { path = "../common", editable = true }

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
