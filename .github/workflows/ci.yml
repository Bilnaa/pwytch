name: CI

on:
  pull_request:
    branches: [develop, main]
  push:
    branches: [develop, main]

jobs:
  branch-flow:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Check source and target branches
        env:
          HEAD: ${{ github.head_ref }}
          BASE: ${{ github.base_ref }}
        run: |
          echo "$HEAD -> $BASE"
          if [ "$BASE" = "main" ]; then
            [[ "$HEAD" == "develop" || "$HEAD" == hotfix/* ]] && exit 0
            echo "::error::Only develop or hotfix/* can be merged into main"
            exit 1
          fi
          if [[ "$HEAD" =~ ^(feature|fix|chore|docs|hotfix|microservice)/ ]]; then
            exit 0
          fi
          echo "::error::Branch '$HEAD' must start with feature/, fix/, chore/, docs/, hotfix/ or microservice/"
          exit 1

  services:
    runs-on: ubuntu-latest
    outputs:
      list: ${{ steps.find.outputs.list }}
    steps:
      - uses: actions/checkout@v4
      - id: find
        run: echo "list=$(ls -d */pyproject.toml | xargs -n1 dirname | jq -R . | jq -sc .)" >> "$GITHUB_OUTPUT"

  tests:
    needs: services
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service: ${{ fromJson(needs.services.outputs.list) }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - name: Install dependencies
        run: uv sync --locked --directory ${{ matrix.service }}
      - name: Run tests
        run: uv run --directory ${{ matrix.service }} pytest -v
