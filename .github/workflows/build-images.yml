name: Build images

on:
  push:
    branches: [develop]
    paths:
      - main/**
      - stream/**
      - live-chat/**
      - replay/**
      - search/**
      - bookmarks/**
      - stats/**
      - common/**
      - web/**
      - .github/workflows/build-images.yml
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  # ghcr.io wants the owner in lowercase
  REGISTRY: ghcr.io/bilnaa

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service: [main, stream, live-chat, replay, search, bookmarks, stats]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push ${{ matrix.service }}
        uses: docker/build-push-action@v6
        with:
          # the repo root is the context, the services copy ../common
          context: .
          file: ${{ matrix.service }}/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          # tagged with the commit sha, never latest
          tags: ${{ env.REGISTRY }}/pwytch-${{ matrix.service }}:${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}

  # Once all 7 images are published, point the dev manifests of the CD repo at them.
  # One commit per build. The commit lands in another repo, so it cannot retrigger this workflow.
  update-cd:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Check out the CD repo
        uses: actions/checkout@v4
        with:
          repository: Bilnaa/pwytch-cd
          ssh-key: ${{ secrets.CD_DEPLOY_KEY }}
      - name: Update the image tags of dev
        run: |
          sed -i -E "s#(ghcr.io/bilnaa/pwytch-[a-z-]+):[0-9a-f]{40}#\1:${GITHUB_SHA}#" k8s/dev/*.yaml
          git diff --stat
      - name: Commit and push
        run: |
          git diff --quiet && echo "tags already up to date" && exit 0
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -am "deploy(dev): images ${GITHUB_SHA::7}"
          git pull --rebase
          git push
