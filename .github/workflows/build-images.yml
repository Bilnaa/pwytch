name: Build images

on:
  push:
    branches: [develop]
    paths:
      - main/**
      - stream/**
      - live-chat/**
      - replay/**
      - search/**
      - bookmarks/**
      - stats/**
      - common/**
      - web/**
      - .github/workflows/build-images.yml
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  # ghcr.io wants the owner in lowercase
  REGISTRY: ghcr.io/bilnaa

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service: [main, stream, live-chat, replay, search, bookmarks, stats]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push ${{ matrix.service }}
        uses: docker/build-push-action@v6
        with:
          # the repo root is the context, the services copy ../common
          context: .
          file: ${{ matrix.service }}/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          # tagged with the commit sha, never latest
          tags: ${{ env.REGISTRY }}/pwytch-${{ matrix.service }}:${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}
