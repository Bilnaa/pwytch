[project]
name = "live-chat"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "common",
    "fastapi[standard]>=0.142.2",
    "psycopg[binary]>=3.3.6",
    "pydantic-settings>=2.15.0",
    "redis>=8.1.0",
    "sqlalchemy[asyncio]>=2.1.2",
]

[dependency-groups]
dev = [
    "fakeredis>=2.39.0",
    "httpx>=0.28.1",
    "pytest>=9.1.1",
]

[tool.uv.sources]
common = { path = "../common", editable = true }

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
